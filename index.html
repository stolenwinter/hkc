<html lang="en">
<head>

    <link rel="preload" as="image" href="hkc.jpg">
    <link rel="preload" as="image" href="bg1.jpg">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #1a1612;
            --bg-secondary: #231d17;
            --bg-tertiary: #2d251e;
            --fg-primary: #f5f0e8;
            --fg-secondary: #c9bfb3;
            --fg-muted: #8b8276;
            --accent: #c49a6c;
            --accent-light: #d4b08c;
            --accent-dark: #a67c52;
            --card-bg: rgba(35, 29, 23, 0.85);
            --card-border: rgba(196, 154, 108, 0.15);
            --glass-bg: rgba(26, 22, 18, 0.7);
            --glass-border: rgba(196, 154, 108, 0.1);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 40px rgba(196, 154, 108, 0.15);
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: 'Playfair Display', Georgia, serif;
            --space-xs: 0.5rem;
            --space-sm: 1rem;
            --space-md: 1.5rem;
            --space-lg: 2.5rem;
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-full: 9999px;
            --transition-base: 300ms ease;
            --transition-bounce: 400ms cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-primary: #faf8f5;
                --bg-secondary: #f0ebe3;
                --bg-tertiary: #e6dfd6;
                --fg-primary: #1a1612;
                --fg-secondary: #3d362d;
                --fg-muted: #7a7267;
                --accent: #a67c52;
                --accent-light: #c49a6c;
                --accent-dark: #8b6542;
                --card-bg: rgba(250, 248, 245, 0.9);
                --card-border: rgba(166, 124, 82, 0.2);
                --glass-bg: rgba(250, 248, 245, 0.8);
                --glass-border: rgba(166, 124, 82, 0.15);
                --shadow-sm: 0 2px 8px rgba(26, 22, 18, 0.08);
                --shadow-md: 0 8px 32px rgba(26, 22, 18, 0.12);
                --shadow-lg: 0 20px 60px rgba(26, 22, 18, 0.15);
                --shadow-glow: 0 0 40px rgba(166, 124, 82, 0.2);
            }
        }

        .theme-dark {
            --bg-primary: #1a1612;
            --bg-secondary: #231d17;
            --bg-tertiary: #2d251e;
            --fg-primary: #f5f0e8;
            --fg-secondary: #c9bfb3;
            --fg-muted: #8b8276;
            --accent: #c49a6c;
            --accent-light: #d4b08c;
            --accent-dark: #a67c52;
            --card-bg: rgba(35, 29, 23, 0.85);
            --card-border: rgba(196, 154, 108, 0.15);
            --glass-bg: rgba(26, 22, 18, 0.7);
            --glass-border: rgba(196, 154, 108, 0.1);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 40px rgba(196, 154, 108, 0.15);
        }

        .theme-light {
            --bg-primary: #faf8f5;
            --bg-secondary: #f0ebe3;
            --bg-tertiary: #e6dfd6;
            --fg-primary: #1a1612;
            --fg-secondary: #3d362d;
            --fg-muted: #7a7267;
            --accent: #a67c52;
            --accent-light: #c49a6c;
            --accent-dark: #8b6542;
            --card-bg: rgba(250, 248, 245, 0.9);
            --card-border: rgba(166, 124, 82, 0.2);
            --glass-bg: rgba(250, 248, 245, 0.8);
            --glass-border: rgba(166, 124, 82, 0.15);
            --shadow-sm: 0 2px 8px rgba(26, 22, 18, 0.08);
            --shadow-md: 0 8px 32px rgba(26, 22, 18, 0.12);
            --shadow-lg: 0 20px 60px rgba(26, 22, 18, 0.15);
            --shadow-glow: 0 0 40px rgba(166, 124, 82, 0.2);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-primary);
            color: var(--fg-primary);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            flex-direction: column;
        }

        /* Background */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.12;
            filter: saturate(0.5) contrast(1.1);
        }

        @media (prefers-color-scheme: light) {
            .bg-image { opacity: 0.06; }
        }

        .bg-gradient {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% 0%, rgba(196, 154, 108, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(196, 154, 108, 0.05) 0%, transparent 50%),
                linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-primary) 100%);
        }

        .bg-noise {
            position: absolute;
            inset: 0;
            opacity: 0.02;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* Layout */
        .page {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
            padding: var(--space-sm) var(--space-lg);
        }

        /* Top: Logo only */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-xs) 0;
            flex-shrink: 0;
        }

        .logo-link {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            text-decoration: none;
            color: var(--fg-primary);
            opacity: 0.9;
            transition: opacity var(--transition-base);
        }

        .logo-link:hover { opacity: 1; }

        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            object-fit: cover;
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--fg-primary);
            transition: all var(--transition-base);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            background: var(--bg-tertiary);
            transform: scale(1.05);
        }

        .theme-toggle:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .theme-toggle .sun-icon { display: none; }
        .theme-toggle .moon-icon { display: block; }

        .theme-light .theme-toggle .sun-icon { display: block; }
        .theme-light .theme-toggle .moon-icon { display: none; }

        /* Center: Profile + Name + Subtitle */
        .center-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 0;
            padding: var(--space-md) 0;
        }

        .profile-card {
            position: relative;
            margin-bottom: var(--space-lg);
        }

        .profile-ring {
            position: relative;
            display: inline-block;
            padding: 4px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-light), var(--accent-dark));
            background-size: 200% 200%;
            animation: ring-rotate 8s linear infinite;
        }

        @keyframes ring-rotate {
            from { background-position: 0% 50%; }
            to { background-position: 200% 50%; }
        }

        .profile-ring::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-light), var(--accent-dark));
            background-size: 200% 200%;
            filter: blur(20px);
            opacity: 0.35;
            animation: ring-pulse 3s ease-in-out infinite;
        }

        @keyframes ring-pulse {
            0%, 100% { opacity: 0.25; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(1.08); }
        }

        .profile-image-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--bg-tertiary);
        }

        .profile-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--transition-slow);
        }

        .profile-card:hover .profile-image {
            transform: scale(1.03);
        }

        .hero-name {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 500;
            line-height: 1.15;
            letter-spacing: -0.03em;
            color: var(--fg-primary);
            margin-bottom: var(--space-xs);
            background: linear-gradient(135deg, var(--fg-primary) 0%, var(--fg-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            font-family: var(--font-display);
            font-size: clamp(1rem, 2.2vw, 1.375rem);
            font-style: italic;
            font-weight: 400;
            color: var(--accent);
            position: relative;
            display: inline-block;
        }

        .hero-subtitle::before,
        .hero-subtitle::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent));
        }

        .hero-subtitle::before { left: -65px; }
        .hero-subtitle::after { right: -65px; background: linear-gradient(270deg, transparent, var(--accent)); }

        @media (max-width: 480px) {
            .hero-subtitle::before,
            .hero-subtitle::after { display: none; }
        }

        /* Bottom: Social Links */
        .bottom-bar {
            flex-shrink: 0;
            padding: var(--space-sm) 0;
        }

        .social-grid {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-sm);
            justify-content: center;
        }

        .social-link {
            position: relative;
            width: 50px;
            height: 50px;
            border-radius: var(--radius-md);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--fg-secondary);
            text-decoration: none;
            font-size: 1.25rem;
            transition: all var(--transition-bounce);
            backdrop-filter: blur(20px);
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--brand-color, var(--accent));
            transform: scale(0);
            border-radius: var(--radius-md);
            transition: transform var(--transition-bounce);
            z-index: -1;
        }

        .social-link:hover {
            color: var(--bg-primary);
            border-color: var(--brand-color, var(--accent));
            transform: translateY(-3px) rotate(3deg);
            box-shadow: var(--shadow-lg);
        }

        .social-link:hover::before {
            transform: scale(1);
        }

        .social-link:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .social-link[data-platform="facebook"] { --brand-color: #3b5998; }
        .social-link[data-platform="instagram"] { --brand-color: #e1306c; }
        .social-link[data-platform="telegram"] { --brand-color: #0088cc; }
        .social-link[data-platform="goodreads"] { --brand-color: #553b08; }
        .social-link[data-platform="youtube"] { --brand-color: #ff0000; }
        .social-link[data-platform="github"] { --brand-color: #24292e; }
        .social-link[data-platform="linkedin"] { --brand-color: #0a66c2; }
        .social-link[data-platform="twitter"] { --brand-color: #1da1f2; }

        .social-tooltip {
            position: absolute;
            bottom: -36px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-tertiary);
            color: var(--fg-primary);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-size: 0.7rem;
            font-weight: 500;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-fast);
            border: 1px solid var(--card-border);
        }

        .social-link:hover .social-tooltip {
            opacity: 1;
            visibility: visible;
            bottom: -32px;
        }

        /* Responsive */
        @media (max-height: 700px) {
            .page { padding: var(--space-xs) var(--space-md); }
            .center-content { padding: var(--space-sm) 0; }
            .profile-image-wrapper { width: 130px; height: 130px; }
            .social-link { width: 44px; height: 44px; font-size: 1.1rem; }
        }

        @media (max-width: 480px) {
            .page { padding: var(--space-xs) var(--space-md); }
            .logo-img { width: 36px; height: 36px; }
            .theme-toggle { width: 36px; height: 36px; }
            .profile-image-wrapper { width: 120px; height: 120px; }
            .hero-subtitle::before,
            .hero-subtitle::after { display: none; }
            .social-link { width: 42px; height: 42px; font-size: 1rem; gap: 4px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .profile-ring { animation: none; }
            .profile-ring::before { animation: none; }
        }
    </style>
</head>

    <script>
        // Theme Management
        (function() {
            const html = document.documentElement;
            const toggle = document.getElementById('themeToggle');
            const THEME_KEY = 'theme-preference';

            function getInitialTheme() {
                const stored = localStorage.getItem(THEME_KEY);
                if (stored) return stored;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            function applyTheme(theme) {
                html.classList.remove('theme-dark', 'theme-light');
                html.classList.add('theme-' + theme);
                toggle.setAttribute('aria-pressed', theme === 'dark');
                localStorage.setItem(THEME_KEY, theme);
            }

            applyTheme(getInitialTheme());

            toggle.addEventListener('click', function() {
                const isDark = html.classList.contains('theme-dark');
                applyTheme(isDark ? 'light' : 'dark');
                toggle.style.transform = 'scale(0.9)';
                setTimeout(() => { toggle.style.transform = ''; }, 150);
            });

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                if (!localStorage.getItem(THEME_KEY)) {
                    applyTheme(e.matches ? 'dark' : 'light');
                }
            });
        })();
    </script>
